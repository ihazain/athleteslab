{% load i18n %}
<div class="alp-sidebar-controls">
    <button type="button" class="alp-sidebar-button alp-sidebar-hide"
            aria-controls="main-navbar-navigation"
            aria-label="{% translate "Hide menu" %}"
            title="{% translate "Hide menu" %}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M9 4v16"/>
            <path d="M17 9l-3 3 3 3"/>
        </svg>
    </button>
    <button type="button" class="alp-sidebar-button alp-sidebar-toggle"
            aria-controls="main-navbar-navigation"
            aria-expanded="true"
            data-label-collapse="{% translate "Collapse menu" %}"
            data-label-expand="{% translate "Expand menu" %}"
            aria-label="{% translate "Collapse menu" %}"
            title="{% translate "Collapse menu" %}">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
            <path d="M11 6l-6 6 6 6"/>
            <path d="M18 6l-6 6 6 6"/>
        </svg>
    </button>
</div>
{# Moved to the end of the page by sidebar.js, shown while the menu is hidden #}
<button type="button" class="alp-sidebar-show"
        aria-controls="main-navbar-navigation"
        aria-label="{% translate "Show menu" %}"
        title="{% translate "Show menu" %}">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M9 4v16"/>
        <path d="M14 9l3 3-3 3"/>
    </svg>
</button>
